<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="AISOC logo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1f36" />
      <stop offset="100%" stop-color="#04111f" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <radialGradient id="core" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff1f1" />
      <stop offset="45%" stop-color="#ff5c5c" />
      <stop offset="100%" stop-color="#b3122f" />
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#bg)" stroke="#184061" stroke-width="2" />

  <!-- Sentinel hex: security perimeter (hexagon) around an AI hub (node + spokes) -->
  <g filter="url(#glow)">
    <path
      d="M48 21L71.4 34.5V61.5L48 75L24.6 61.5V34.5Z"
      fill="none"
      stroke="url(#neon)"
      stroke-width="5"
      stroke-linejoin="round"
      opacity="0.9"
    />
    <path
      d="M48 48V21M48 48L71.4 61.5M48 48L24.6 61.5"
      fill="none"
      stroke="url(#neon)"
      stroke-width="2.75"
      stroke-linecap="round"
      opacity="0.85"
    />
    <circle cx="48" cy="21" r="3.4" fill="url(#neon)" />
    <circle cx="71.4" cy="61.5" r="3.4" fill="url(#neon)" />
    <circle cx="24.6" cy="61.5" r="3.4" fill="url(#neon)" />
    <circle cx="48" cy="48" r="9.5" fill="url(#core)" />
  </g>
</svg>

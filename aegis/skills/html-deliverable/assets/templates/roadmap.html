<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --theme:#1973b8; --on-theme:#fff; --page-background:#e9f0f3; --page-foreground:#1b2632; --surface:#f9fcfd; --surface-foreground:#1b2632; --ink:var(--page-foreground); --muted:#637282; --line:#d5e0e6; --paper:var(--surface); --blue:var(--theme); --blue-soft:color-mix(in srgb, var(--theme) 12%, white); --green:#16735a; --amber:#af7422; }
    * { box-sizing:border-box; } body { margin:0; color:var(--page-foreground); background:var(--page-background); font:15px/1.55 Manrope,system-ui,sans-serif; } main { max-width:1080px; min-height:100vh; margin:auto; padding:clamp(24px,5vw,68px); background:var(--paper); }
    .eyebrow,.meta { color:var(--blue); font:500 11px "DM Mono",monospace; letter-spacing:.1em; text-transform:uppercase; } h1 { margin:10px 0; font-size:clamp(36px,6vw,62px); line-height:1.02; letter-spacing:-.06em; } .lede { max-width:680px; color:var(--muted); font-size:18px; }
    .overview { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:34px 0 48px; } button.stat { width:100%; color:inherit; font:inherit; text-align:left; cursor:pointer; } .stat { padding:18px; border:1px solid var(--line); border-radius:12px; background:white; } .stat span { display:block; color:var(--muted); font:11px "DM Mono",monospace; text-transform:uppercase; } .stat strong { display:block; margin-top:7px; font-size:19px; }
    h2 { margin:0 0 16px; font-size:22px; letter-spacing:-.03em; } .timeline { position:relative; padding-left:32px; } .timeline::before { content:""; position:absolute; top:8px; bottom:8px; left:7px; width:2px; background:var(--line); } button.phase { display:block; width:100%; border:0; color:inherit; background:transparent; font:inherit; text-align:left; cursor:pointer; } .phase { position:relative; padding:0 0 32px; } .phase::before { content:""; position:absolute; width:14px; height:14px; left:-32px; top:5px; border:3px solid var(--paper); border-radius:50%; background:var(--blue); box-shadow:0 0 0 1px var(--blue); } .phase:last-child { padding-bottom:0; } .phase__header { display:flex; justify-content:space-between; gap:16px; } .phase__title { font-size:18px; font-weight:700; } .date { color:var(--blue); font:12px "DM Mono",monospace; white-space:nowrap; } .phase__description { margin:8px 0; color:var(--muted); } .details { display:flex; flex-wrap:wrap; gap:8px; } .chip { padding:4px 8px; border-radius:6px; background:var(--blue-soft); color:#225c8d; font-size:12px; } .status-green { color:var(--green); } .status-amber { color:var(--amber); }
    .bottom { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:44px; } .card { padding:22px; border:1px solid var(--line); border-radius:12px; background:white; } .card h2 { font-size:17px; } .card p,.card li { color:var(--muted); } .card p { margin:0; } ul { margin:0; padding-left:18px; } footer { margin-top:40px; color:var(--muted); font-size:12px; }
    @media (max-width:680px) { .overview,.bottom { grid-template-columns:1fr; } .phase header { display:block; } .date { display:block; margin-top:5px; } }
  </style>
</head>
<body>
  <main>
    <header><div class="eyebrow">{{ROADMAP_TYPE}}</div><h1>{{TITLE}}</h1><p class="lede">{{ROADMAP_SUMMARY}}</p><p class="meta">Last updated {{UPDATED_AT}}</p></header>
    <section class="overview" aria-label="Roadmap overview"><button type="button" class="stat agent2ui-object" data-agent2ui-content="Horizon: {{TIME_HORIZON}}" aria-label="Use timeline horizon in chat"><span>Horizon</span><strong>{{TIME_HORIZON}}</strong></button><button type="button" class="stat agent2ui-object" data-agent2ui-content="Accountable owner: {{PRIMARY_OWNER}}" aria-label="Use accountable owner in chat"><span>Accountable owner</span><strong>{{PRIMARY_OWNER}}</strong></button><button type="button" class="stat agent2ui-object" data-agent2ui-content="Next decision: {{NEXT_DECISION}}" aria-label="Use next decision in chat"><span>Next decision</span><strong>{{NEXT_DECISION}}</strong></button></section>
    <section aria-labelledby="timeline-heading"><h2 id="timeline-heading">Delivery timeline</h2><div class="timeline">
      <button type="button" class="phase agent2ui-object" data-agent2ui-content="{{PHASE_1_NAME}} ({{PHASE_1_DATE}}): {{PHASE_1_DESCRIPTION}} Owner: {{PHASE_1_OWNER}}. Status: {{PHASE_1_STATUS}}. Dependency: {{PHASE_1_DEPENDENCY}}" aria-label="Use milestone one in chat"><span class="phase__header"><span class="phase__title">{{PHASE_1_NAME}}</span><span class="date">{{PHASE_1_DATE}}</span></span><span class="phase__description">{{PHASE_1_DESCRIPTION}}</span><span class="details"><span class="chip">Owner: {{PHASE_1_OWNER}}</span><span class="chip status-green">Status: {{PHASE_1_STATUS}}</span><span class="chip">Dependency: {{PHASE_1_DEPENDENCY}}</span></span></button>
      <button type="button" class="phase agent2ui-object" data-agent2ui-content="{{PHASE_2_NAME}} ({{PHASE_2_DATE}}): {{PHASE_2_DESCRIPTION}} Owner: {{PHASE_2_OWNER}}. Status: {{PHASE_2_STATUS}}. Dependency: {{PHASE_2_DEPENDENCY}}" aria-label="Use milestone two in chat"><span class="phase__header"><span class="phase__title">{{PHASE_2_NAME}}</span><span class="date">{{PHASE_2_DATE}}</span></span><span class="phase__description">{{PHASE_2_DESCRIPTION}}</span><span class="details"><span class="chip">Owner: {{PHASE_2_OWNER}}</span><span class="chip status-amber">Status: {{PHASE_2_STATUS}}</span><span class="chip">Dependency: {{PHASE_2_DEPENDENCY}}</span></span></button>
      <button type="button" class="phase agent2ui-object" data-agent2ui-content="{{PHASE_3_NAME}} ({{PHASE_3_DATE}}): {{PHASE_3_DESCRIPTION}} Owner: {{PHASE_3_OWNER}}. Status: {{PHASE_3_STATUS}}. Dependency: {{PHASE_3_DEPENDENCY}}" aria-label="Use milestone three in chat"><span class="phase__header"><span class="phase__title">{{PHASE_3_NAME}}</span><span class="date">{{PHASE_3_DATE}}</span></span><span class="phase__description">{{PHASE_3_DESCRIPTION}}</span><span class="details"><span class="chip">Owner: {{PHASE_3_OWNER}}</span><span class="chip">Status: {{PHASE_3_STATUS}}</span><span class="chip">Dependency: {{PHASE_3_DEPENDENCY}}</span></span></button>
    </div></section>
    <section class="bottom"><article class="card"><h2>Immediate next action</h2><p>{{IMMEDIATE_NEXT_ACTION}}</p></article><article class="card"><h2>Risks and watch items</h2><ul>{{RISK_ITEMS}}</ul></article></section>
    <footer>{{ASSUMPTION_OR_SOURCE_NOTE}}</footer>
  </main>
  <script>
(() => {
  "use strict";

  const channel = "aegis-agent2ui";
  const version = 1;
  const objectSelector = "[data-agent2ui-content]";
  let selectedText = "";
  let overlay = null;

  const style = document.createElement("style");
  style.textContent = `
    .agent2ui-object { cursor:pointer; }
    .agent2ui-object:focus-visible, .agent2ui-menu button:focus-visible, .agent2ui-prefix input:focus-visible { outline:3px solid var(--theme, #087ea4); outline-offset:3px; }
    .agent2ui-menu, .agent2ui-prefix { position:fixed; z-index:2147483647; width:min(248px, calc(100vw - 24px)); padding:6px; border:1px solid var(--line, #c6d2e0); border-radius:10px; background:var(--surface, #fff); color:var(--surface-foreground, #142235); box-shadow:0 12px 34px rgb(20 34 53 / .22); }
    .agent2ui-menu button { display:block; width:100%; border:0; border-radius:7px; padding:9px 10px; background:transparent; color:inherit; font:inherit; text-align:left; cursor:pointer; }
    .agent2ui-menu button:hover, .agent2ui-menu button:focus-visible { background:var(--page-background, #f4f7fb); }
    .agent2ui-prefix { display:grid; gap:8px; padding:10px; }
    .agent2ui-prefix label { font:600 12px/1.3 system-ui, sans-serif; }
    .agent2ui-prefix input { width:100%; border:1px solid var(--line, #c6d2e0); border-radius:6px; padding:8px; background:var(--page-background, #f4f7fb); color:inherit; font:inherit; }
    .agent2ui-prefix__actions { display:flex; justify-content:flex-end; gap:8px; }
    .agent2ui-prefix button { border:1px solid var(--line, #c6d2e0); border-radius:6px; padding:6px 9px; background:var(--surface, #fff); color:inherit; font:inherit; cursor:pointer; }
    .agent2ui-prefix button[type="submit"] { border-color:var(--theme, #087ea4); background:var(--theme, #087ea4); color:var(--on-theme, #fff); }
  `;
  document.head.append(style);

  function emit(text) {
    if (!text || !text.trim()) return;
    window.parent.postMessage(
      { channel, version, type: "composer.insert", text },
      "*",
    );
  }

  function formValue(field) {
    if (field instanceof HTMLInputElement) {
      if (field.type === "checkbox") return field.checked ? "true" : "false";
      if (field.type === "radio" && !field.checked) return null;
    }
    if (field instanceof HTMLSelectElement && field.multiple) {
      return Array.from(field.selectedOptions, (option) => option.value).join(", ");
    }
    return field.value;
  }

  function serializeFormFields(form) {
    return Array.from(form.querySelectorAll("input, textarea, select"))
      .filter((field) => {
        if (!(field instanceof HTMLInputElement || field instanceof HTMLTextAreaElement || field instanceof HTMLSelectElement)) return false;
        if (!field.id || field.disabled) return false;
        return !["button", "submit", "reset", "image", "file", "hidden"].includes(field.type);
      })
      .map((field) => {
        const value = formValue(field);
        return value === null ? null : `${field.id} : ${String(value).replace(/[\r\n]+/g, " ").trim()}`;
      })
      .filter((line) => line !== null)
      .join("\n");
  }

  function closeOverlay() {
    overlay?.remove();
    overlay = null;
  }

  function place(node, x, y) {
    document.body.append(node);
    const margin = 12;
    const rect = node.getBoundingClientRect();
    node.style.left = `${Math.max(margin, Math.min(x, window.innerWidth - rect.width - margin))}px`;
    node.style.top = `${Math.max(margin, Math.min(y, window.innerHeight - rect.height - margin))}px`;
    overlay = node;
  }

  function openPrefixInput(x, y) {
    closeOverlay();
    const form = document.createElement("form");
    form.className = "agent2ui-prefix";
    form.setAttribute("role", "dialog");
    form.setAttribute("aria-label", "自定义前缀");
    form.innerHTML = `<label for="agent2ui-prefix-input">自定义前缀</label><input id="agent2ui-prefix-input" type="text" autocomplete="off"><div class="agent2ui-prefix__actions"><button type="button">取消</button><button type="submit">插入</button></div>`;
    const input = form.querySelector("input");
    const [cancel] = form.querySelectorAll("button");
    function insertPrefix() {
      const prefix = input.value.trim();
      if (prefix) emit(`${prefix}\n${selectedText}`);
      closeOverlay();
    }
    cancel.addEventListener("click", closeOverlay);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      insertPrefix();
    });
    input.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        closeOverlay();
      }
    });
    input.addEventListener("blur", () => {
      window.setTimeout(() => {
        if (overlay === form && !form.contains(document.activeElement)) closeOverlay();
      }, 0);
    });
    place(form, x, y);
    input.focus();
  }

  function openMenu(x, y) {
    closeOverlay();
    const menu = document.createElement("div");
    menu.className = "agent2ui-menu";
    menu.setAttribute("role", "menu");
    menu.setAttribute("aria-label", "选中文本操作");
    const actions = [
      ["进一步分析…", () => emit(`进一步分析：\n${selectedText}`)],
      ["进一步调查…", () => emit(`进一步调查：\n${selectedText}`)],
      ["自定义前缀…", () => openPrefixInput(x, y)],
    ];
    actions.forEach(([label, action]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.setAttribute("role", "menuitem");
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        if (label !== "自定义前缀…") closeOverlay();
        action();
      });
      menu.append(button);
    });
    place(menu, x, y);
    menu.querySelector("button")?.focus();
  }

  document.addEventListener("click", (event) => {
    const target = event.target instanceof Element ? event.target.closest(objectSelector) : null;
    if (target) emit(target.getAttribute("data-agent2ui-content") || target.textContent || "");
    if (overlay && !overlay.contains(event.target)) closeOverlay();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeOverlay();
    const target = event.target instanceof Element ? event.target.closest(objectSelector) : null;
    if (
      target &&
      target.tagName !== "BUTTON" &&
      target.getAttribute("role") === "button" &&
      (event.key === "Enter" || event.key === " ")
    ) {
      event.preventDefault();
      emit(target.getAttribute("data-agent2ui-content") || target.textContent || "");
    }
  });

  document.addEventListener("submit", (event) => {
    const form = event.target;
    if (!(form instanceof HTMLFormElement) || !form.hasAttribute("data-agent2ui-form")) return;
    event.preventDefault();
    emit(serializeFormFields(form));
  });

  document.addEventListener("contextmenu", (event) => {
    if (overlay?.contains(event.target)) return;
    const text = window.getSelection()?.toString().trim() || "";
    if (!text) return;
    event.preventDefault();
    selectedText = text;
    openMenu(event.clientX, event.clientY);
  });

  document.addEventListener("pointerdown", (event) => {
    if (overlay && !overlay.contains(event.target)) closeOverlay();
  });
  window.addEventListener("scroll", closeOverlay, true);
  window.addEventListener("resize", closeOverlay);
})();

  </script>
</body>
</html>

<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --theme:#61dbb0; --on-theme:#08120f; --page-background:#101827; --page-foreground:#eef4fb; --surface:#182235; --surface-foreground:#eef4fb; --bg:var(--page-background); --panel:var(--surface); --line:#2a3950; --text:var(--page-foreground); --muted:#b4c1d3; --accent:var(--theme); --blue:#7cb6ff; }
    * { box-sizing:border-box; } body { margin:0; background:var(--page-background); color:var(--page-foreground); font:14px/1.5 Manrope,system-ui,sans-serif; }
    main { max-width:1200px; margin:auto; padding:clamp(22px,5vw,64px); } .meta { color:var(--accent); font:500 11px "DM Mono",monospace; letter-spacing:.1em; text-transform:uppercase; }
    h1 { margin:7px 0 4px; font-size:clamp(32px,5vw,50px); letter-spacing:-.05em; } .subtitle { margin:0; color:var(--muted); } .top { display:flex; justify-content:space-between; gap:24px; align-items:end; } .updated { color:var(--muted); font:12px "DM Mono",monospace; white-space:nowrap; }
    .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:32px 0 14px; } .panel { border:1px solid var(--line); border-radius:14px; background:var(--panel); padding:20px; } .kpi-button { width:100%; color:inherit; font:inherit; text-align:left; cursor:pointer; } .label { color:var(--muted); font:11px "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; } .value { display:block; margin:8px 0 2px; font-size:30px; font-weight:800; letter-spacing:-.05em; } .delta { color:var(--accent); font-size:12px; }
    .content { display:grid; grid-template-columns:1.45fr .9fr; gap:14px; } h2 { margin:0 0 18px; font-size:17px; } canvas { width:100% !important; max-height:300px; } table { width:100%; border-collapse:collapse; } caption { text-align:left; margin-bottom:12px; font-weight:700; } th,td { padding:12px 4px; border-bottom:1px solid var(--line); text-align:left; } th { color:var(--muted); font:11px "DM Mono",monospace; text-transform:uppercase; } .note { margin-top:14px; color:var(--muted); font-size:12px; } .status { color:var(--accent); }
    @media (max-width:850px) { .kpis { grid-template-columns:repeat(2,1fr); } .content { grid-template-columns:1fr; } } @media (max-width:500px) { .top { display:block; } .updated { margin-top:16px; } }
  </style>
</head>
<body>
  <main>
    <header class="top"><div><div class="meta">{{DASHBOARD_TYPE}}</div><h1>{{TITLE}}</h1><p class="subtitle">{{SUBTITLE}}</p></div><div class="updated">Updated {{UPDATED_AT}}</div></header>
    <section class="kpis" aria-label="Key performance indicators">
      <button type="button" class="panel kpi-button agent2ui-object" data-agent2ui-content="{{KPI_1_LABEL}}: {{KPI_1_VALUE}} ({{KPI_1_CHANGE}})" aria-label="Use KPI one in chat"><span class="label">{{KPI_1_LABEL}}</span><strong class="value">{{KPI_1_VALUE}}</strong><span class="delta">{{KPI_1_CHANGE}}</span></button>
      <button type="button" class="panel kpi-button agent2ui-object" data-agent2ui-content="{{KPI_2_LABEL}}: {{KPI_2_VALUE}} ({{KPI_2_CHANGE}})" aria-label="Use KPI two in chat"><span class="label">{{KPI_2_LABEL}}</span><strong class="value">{{KPI_2_VALUE}}</strong><span class="delta">{{KPI_2_CHANGE}}</span></button>
      <button type="button" class="panel kpi-button agent2ui-object" data-agent2ui-content="{{KPI_3_LABEL}}: {{KPI_3_VALUE}} ({{KPI_3_CHANGE}})" aria-label="Use KPI three in chat"><span class="label">{{KPI_3_LABEL}}</span><strong class="value">{{KPI_3_VALUE}}</strong><span class="delta">{{KPI_3_CHANGE}}</span></button>
      <button type="button" class="panel kpi-button agent2ui-object" data-agent2ui-content="{{KPI_4_LABEL}}: {{KPI_4_VALUE}} ({{KPI_4_CHANGE}})" aria-label="Use KPI four in chat"><span class="label">{{KPI_4_LABEL}}</span><strong class="value">{{KPI_4_VALUE}}</strong><span class="delta">{{KPI_4_CHANGE}}</span></button>
    </section>
    <section class="content">
      <article class="panel"><h2>{{CHART_TITLE}}</h2><canvas id="trend-chart" aria-label="{{CHART_ACCESSIBLE_DESCRIPTION}}" role="img"></canvas><p class="note">{{CHART_TEXT_ALTERNATIVE}}</p></article>
      <article class="panel"><table><caption>{{TABLE_TITLE}}</caption><thead><tr><th>{{COLUMN_1}}</th><th>{{COLUMN_2}}</th><th>{{COLUMN_3}}</th></tr></thead><tbody>{{TABLE_ROWS}}</tbody></table><p class="note">{{DATA_NOTE}}</p></article>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
(() => {
  "use strict";

  const channel = "aegis-agent2ui";
  const version = 1;
  const objectSelector = "[data-agent2ui-content]";
  let selectedText = "";
  let overlay = null;

  const style = document.createElement("style");
  style.textContent = `
    .agent2ui-object { cursor:pointer; }
    .agent2ui-object:focus-visible, .agent2ui-menu button:focus-visible, .agent2ui-prefix input:focus-visible { outline:3px solid var(--theme, #087ea4); outline-offset:3px; }
    .agent2ui-menu, .agent2ui-prefix { position:fixed; z-index:2147483647; width:min(248px, calc(100vw - 24px)); padding:6px; border:1px solid var(--line, #c6d2e0); border-radius:10px; background:var(--surface, #fff); color:var(--surface-foreground, #142235); box-shadow:0 12px 34px rgb(20 34 53 / .22); }
    .agent2ui-menu button { display:block; width:100%; border:0; border-radius:7px; padding:9px 10px; background:transparent; color:inherit; font:inherit; text-align:left; cursor:pointer; }
    .agent2ui-menu button:hover, .agent2ui-menu button:focus-visible { background:var(--page-background, #f4f7fb); }
    .agent2ui-prefix { display:grid; gap:8px; padding:10px; }
    .agent2ui-prefix label { font:600 12px/1.3 system-ui, sans-serif; }
    .agent2ui-prefix input { width:100%; border:1px solid var(--line, #c6d2e0); border-radius:6px; padding:8px; background:var(--page-background, #f4f7fb); color:inherit; font:inherit; }
    .agent2ui-prefix__actions { display:flex; justify-content:flex-end; gap:8px; }
    .agent2ui-prefix button { border:1px solid var(--line, #c6d2e0); border-radius:6px; padding:6px 9px; background:var(--surface, #fff); color:inherit; font:inherit; cursor:pointer; }
    .agent2ui-prefix button[type="submit"] { border-color:var(--theme, #087ea4); background:var(--theme, #087ea4); color:var(--on-theme, #fff); }
  `;
  document.head.append(style);

  function emit(text) {
    if (!text || !text.trim()) return;
    window.parent.postMessage(
      { channel, version, type: "composer.insert", text },
      "*",
    );
  }

  function formValue(field) {
    if (field instanceof HTMLInputElement) {
      if (field.type === "checkbox") return field.checked ? "true" : "false";
      if (field.type === "radio" && !field.checked) return null;
    }
    if (field instanceof HTMLSelectElement && field.multiple) {
      return Array.from(field.selectedOptions, (option) => option.value).join(", ");
    }
    return field.value;
  }

  function serializeFormFields(form) {
    return Array.from(form.querySelectorAll("input, textarea, select"))
      .filter((field) => {
        if (!(field instanceof HTMLInputElement || field instanceof HTMLTextAreaElement || field instanceof HTMLSelectElement)) return false;
        if (!field.id || field.disabled) return false;
        return !["button", "submit", "reset", "image", "file", "hidden"].includes(field.type);
      })
      .map((field) => {
        const value = formValue(field);
        return value === null ? null : `${field.id} : ${String(value).replace(/[\r\n]+/g, " ").trim()}`;
      })
      .filter((line) => line !== null)
      .join("\n");
  }

  function closeOverlay() {
    overlay?.remove();
    overlay = null;
  }

  function place(node, x, y) {
    document.body.append(node);
    const margin = 12;
    const rect = node.getBoundingClientRect();
    node.style.left = `${Math.max(margin, Math.min(x, window.innerWidth - rect.width - margin))}px`;
    node.style.top = `${Math.max(margin, Math.min(y, window.innerHeight - rect.height - margin))}px`;
    overlay = node;
  }

  function openPrefixInput(x, y) {
    closeOverlay();
    const form = document.createElement("form");
    form.className = "agent2ui-prefix";
    form.setAttribute("role", "dialog");
    form.setAttribute("aria-label", "自定义前缀");
    form.innerHTML = `<label for="agent2ui-prefix-input">自定义前缀</label><input id="agent2ui-prefix-input" type="text" autocomplete="off"><div class="agent2ui-prefix__actions"><button type="button">取消</button><button type="submit">插入</button></div>`;
    const input = form.querySelector("input");
    const [cancel] = form.querySelectorAll("button");
    function insertPrefix() {
      const prefix = input.value.trim();
      if (prefix) emit(`${prefix}\n${selectedText}`);
      closeOverlay();
    }
    cancel.addEventListener("click", closeOverlay);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      insertPrefix();
    });
    input.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        closeOverlay();
      }
    });
    input.addEventListener("blur", () => {
      window.setTimeout(() => {
        if (overlay === form && !form.contains(document.activeElement)) closeOverlay();
      }, 0);
    });
    place(form, x, y);
    input.focus();
  }

  function openMenu(x, y) {
    closeOverlay();
    const menu = document.createElement("div");
    menu.className = "agent2ui-menu";
    menu.setAttribute("role", "menu");
    menu.setAttribute("aria-label", "选中文本操作");
    const actions = [
      ["进一步分析…", () => emit(`进一步分析：\n${selectedText}`)],
      ["进一步调查…", () => emit(`进一步调查：\n${selectedText}`)],
      ["自定义前缀…", () => openPrefixInput(x, y)],
    ];
    actions.forEach(([label, action]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.setAttribute("role", "menuitem");
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        if (label !== "自定义前缀…") closeOverlay();
        action();
      });
      menu.append(button);
    });
    place(menu, x, y);
    menu.querySelector("button")?.focus();
  }

  document.addEventListener("click", (event) => {
    const target = event.target instanceof Element ? event.target.closest(objectSelector) : null;
    if (target) emit(target.getAttribute("data-agent2ui-content") || target.textContent || "");
    if (overlay && !overlay.contains(event.target)) closeOverlay();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeOverlay();
    const target = event.target instanceof Element ? event.target.closest(objectSelector) : null;
    if (
      target &&
      target.tagName !== "BUTTON" &&
      target.getAttribute("role") === "button" &&
      (event.key === "Enter" || event.key === " ")
    ) {
      event.preventDefault();
      emit(target.getAttribute("data-agent2ui-content") || target.textContent || "");
    }
  });

  document.addEventListener("submit", (event) => {
    const form = event.target;
    if (!(form instanceof HTMLFormElement) || !form.hasAttribute("data-agent2ui-form")) return;
    event.preventDefault();
    emit(serializeFormFields(form));
  });

  document.addEventListener("contextmenu", (event) => {
    if (overlay?.contains(event.target)) return;
    const text = window.getSelection()?.toString().trim() || "";
    if (!text) return;
    event.preventDefault();
    selectedText = text;
    openMenu(event.clientX, event.clientY);
  });

  document.addEventListener("pointerdown", (event) => {
    if (overlay && !overlay.contains(event.target)) closeOverlay();
  });
  window.addEventListener("scroll", closeOverlay, true);
  window.addEventListener("resize", closeOverlay);
})();

  </script>
</body>
</html>

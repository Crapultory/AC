<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --theme:#6548c9; --on-theme:#fff; --page-background:#f5f3fa; --page-foreground:#1e1d25; --surface:#fff; --surface-foreground:#1e1d25; --ink:var(--page-foreground); --muted:#696678; --line:#dfdce7; --bg:var(--page-background); --purple:var(--theme); --purple-soft:color-mix(in srgb, var(--theme) 12%, white); --gold:#ab7729; }
    * { box-sizing:border-box; } body { margin:0; background:var(--page-background); color:var(--page-foreground); font:15px/1.55 Manrope,system-ui,sans-serif; } main { max-width:1120px; margin:auto; padding:clamp(24px,5vw,68px); }
    .eyebrow,.meta { color:var(--purple); font:500 11px "DM Mono",monospace; letter-spacing:.1em; text-transform:uppercase; } h1 { max-width:800px; margin:12px 0; font-size:clamp(36px,6vw,64px); line-height:1; letter-spacing:-.06em; } .lede { max-width:690px; color:var(--muted); font-size:18px; }
    .recommendation { display:grid; grid-template-columns:auto 1fr; width:100%; gap:18px; align-items:start; margin:38px 0; padding:24px; border:0; border-radius:16px; background:var(--purple); color:var(--on-theme); font:inherit; text-align:left; cursor:pointer; } .badge { padding:5px 8px; border:1px solid color-mix(in srgb, var(--on-theme) 42%, transparent); border-radius:99px; font:11px "DM Mono",monospace; letter-spacing:.08em; } .recommendation-heading { display:block; margin:0 0 7px; font-size:22px; font-weight:700; } .recommendation-detail { display:block; color:color-mix(in srgb, var(--on-theme) 88%, transparent); }
    section { margin-top:42px; } h2 { margin:0 0 15px; font-size:22px; letter-spacing:-.03em; } .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:14px; background:var(--surface); } table { width:100%; min-width:720px; border-collapse:collapse; } caption { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); } th,td { padding:18px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; } th { background:#faf9fd; font-size:12px; } th:first-child { color:var(--muted); font:11px "DM Mono",monospace; letter-spacing:.07em; text-transform:uppercase; } tr:last-child td { border-bottom:0; } .winner { color:var(--purple); font-weight:800; } .tradeoffs { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; } button.card { width:100%; color:inherit; font:inherit; text-align:left; cursor:pointer; } .card { padding:22px; border:1px solid var(--line); border-radius:14px; background:var(--surface); } .card h3 { margin:0 0 9px; font-size:16px; } .card p { margin:0; color:var(--muted); } .caveat { padding:18px 20px; border-left:3px solid var(--gold); background:#fff9eb; color:#5a4b2c; }
    footer { margin-top:44px; color:var(--muted); font-size:12px; } @media (max-width:680px) { .tradeoffs { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <header><div class="eyebrow">{{COMPARISON_TYPE}}</div><h1>{{TITLE}}</h1><p class="lede">{{DECISION_CONTEXT}}</p><p class="meta">Prepared {{UPDATED_AT}}</p></header>
    <button type="button" class="recommendation agent2ui-object" data-agent2ui-content="{{RECOMMENDED_OPTION}}: {{RECOMMENDATION_RATIONALE}}" aria-label="Use recommendation in chat"><span class="badge">Recommendation</span><span><span class="recommendation-heading">{{RECOMMENDED_OPTION}}</span><span class="recommendation-detail">{{RECOMMENDATION_RATIONALE}}</span></span></button>
    <section aria-labelledby="matrix-heading"><h2 id="matrix-heading">Comparison matrix</h2><div class="table-wrap"><table><caption>{{MATRIX_CAPTION}}</caption><thead><tr><th>Criterion</th><th>{{OPTION_1_NAME}}</th><th>{{OPTION_2_NAME}}</th><th>{{OPTION_3_NAME}}</th></tr></thead><tbody>{{COMPARISON_ROWS}}</tbody></table></div></section>
    <section aria-labelledby="tradeoffs-heading"><h2 id="tradeoffs-heading">Trade-offs</h2><div class="tradeoffs"><button type="button" class="card agent2ui-object" data-agent2ui-content="{{OPTION_1_NAME}}: {{OPTION_1_TRADEOFF}}" aria-label="Use option one in chat"><h3>{{OPTION_1_NAME}}</h3><p>{{OPTION_1_TRADEOFF}}</p></button><button type="button" class="card agent2ui-object" data-agent2ui-content="{{OPTION_2_NAME}}: {{OPTION_2_TRADEOFF}}" aria-label="Use option two in chat"><h3>{{OPTION_2_NAME}}</h3><p>{{OPTION_2_TRADEOFF}}</p></button></div></section>
    <section aria-labelledby="caveat-heading"><h2 id="caveat-heading">Decision caveat</h2><div class="caveat">{{CAVEAT_OR_UNKNOWN}}</div></section>
    <footer>{{SOURCE_OR_ASSUMPTION_NOTE}}</footer>
  </main>
  <script>
(() => {
  "use strict";

  const channel = "aegis-agent2ui";
  const version = 1;
  const objectSelector = "[data-agent2ui-content]";
  let selectedText = "";
  let overlay = null;

  const style = document.createElement("style");
  style.textContent = `
    .agent2ui-object { cursor:pointer; }
    .agent2ui-object:focus-visible, .agent2ui-menu button:focus-visible, .agent2ui-prefix input:focus-visible { outline:3px solid var(--theme, #087ea4); outline-offset:3px; }
    .agent2ui-menu, .agent2ui-prefix { position:fixed; z-index:2147483647; width:min(248px, calc(100vw - 24px)); padding:6px; border:1px solid var(--line, #c6d2e0); border-radius:10px; background:var(--surface, #fff); color:var(--surface-foreground, #142235); box-shadow:0 12px 34px rgb(20 34 53 / .22); }
    .agent2ui-menu button { display:block; width:100%; border:0; border-radius:7px; padding:9px 10px; background:transparent; color:inherit; font:inherit; text-align:left; cursor:pointer; }
    .agent2ui-menu button:hover, .agent2ui-menu button:focus-visible { background:var(--page-background, #f4f7fb); }
    .agent2ui-prefix { display:grid; gap:8px; padding:10px; }
    .agent2ui-prefix label { font:600 12px/1.3 system-ui, sans-serif; }
    .agent2ui-prefix input { width:100%; border:1px solid var(--line, #c6d2e0); border-radius:6px; padding:8px; background:var(--page-background, #f4f7fb); color:inherit; font:inherit; }
    .agent2ui-prefix__actions { display:flex; justify-content:flex-end; gap:8px; }
    .agent2ui-prefix button { border:1px solid var(--line, #c6d2e0); border-radius:6px; padding:6px 9px; background:var(--surface, #fff); color:inherit; font:inherit; cursor:pointer; }
    .agent2ui-prefix button[type="submit"] { border-color:var(--theme, #087ea4); background:var(--theme, #087ea4); color:var(--on-theme, #fff); }
  `;
  document.head.append(style);

  function emit(text) {
    if (!text || !text.trim()) return;
    window.parent.postMessage(
      { channel, version, type: "composer.insert", text },
      "*",
    );
  }

  function formValue(field) {
    if (field instanceof HTMLInputElement) {
      if (field.type === "checkbox") return field.checked ? "true" : "false";
      if (field.type === "radio" && !field.checked) return null;
    }
    if (field instanceof HTMLSelectElement && field.multiple) {
      return Array.from(field.selectedOptions, (option) => option.value).join(", ");
    }
    return field.value;
  }

  function serializeFormFields(form) {
    return Array.from(form.querySelectorAll("input, textarea, select"))
      .filter((field) => {
        if (!(field instanceof HTMLInputElement || field instanceof HTMLTextAreaElement || field instanceof HTMLSelectElement)) return false;
        if (!field.id || field.disabled) return false;
        return !["button", "submit", "reset", "image", "file", "hidden"].includes(field.type);
      })
      .map((field) => {
        const value = formValue(field);
        return value === null ? null : `${field.id} : ${String(value).replace(/[\r\n]+/g, " ").trim()}`;
      })
      .filter((line) => line !== null)
      .join("\n");
  }

  function closeOverlay() {
    overlay?.remove();
    overlay = null;
  }

  function place(node, x, y) {
    document.body.append(node);
    const margin = 12;
    const rect = node.getBoundingClientRect();
    node.style.left = `${Math.max(margin, Math.min(x, window.innerWidth - rect.width - margin))}px`;
    node.style.top = `${Math.max(margin, Math.min(y, window.innerHeight - rect.height - margin))}px`;
    overlay = node;
  }

  function openPrefixInput(x, y) {
    closeOverlay();
    const form = document.createElement("form");
    form.className = "agent2ui-prefix";
    form.setAttribute("role", "dialog");
    form.setAttribute("aria-label", "自定义前缀");
    form.innerHTML = `<label for="agent2ui-prefix-input">自定义前缀</label><input id="agent2ui-prefix-input" type="text" autocomplete="off"><div class="agent2ui-prefix__actions"><button type="button">取消</button><button type="submit">插入</button></div>`;
    const input = form.querySelector("input");
    const [cancel] = form.querySelectorAll("button");
    function insertPrefix() {
      const prefix = input.value.trim();
      if (prefix) emit(`${prefix}\n${selectedText}`);
      closeOverlay();
    }
    cancel.addEventListener("click", closeOverlay);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      insertPrefix();
    });
    input.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        closeOverlay();
      }
    });
    input.addEventListener("blur", () => {
      window.setTimeout(() => {
        if (overlay === form && !form.contains(document.activeElement)) closeOverlay();
      }, 0);
    });
    place(form, x, y);
    input.focus();
  }

  function openMenu(x, y) {
    closeOverlay();
    const menu = document.createElement("div");
    menu.className = "agent2ui-menu";
    menu.setAttribute("role", "menu");
    menu.setAttribute("aria-label", "选中文本操作");
    const actions = [
      ["进一步分析…", () => emit(`进一步分析：\n${selectedText}`)],
      ["进一步调查…", () => emit(`进一步调查：\n${selectedText}`)],
      ["自定义前缀…", () => openPrefixInput(x, y)],
    ];
    actions.forEach(([label, action]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.setAttribute("role", "menuitem");
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        if (label !== "自定义前缀…") closeOverlay();
        action();
      });
      menu.append(button);
    });
    place(menu, x, y);
    menu.querySelector("button")?.focus();
  }

  document.addEventListener("click", (event) => {
    const target = event.target instanceof Element ? event.target.closest(objectSelector) : null;
    if (target) emit(target.getAttribute("data-agent2ui-content") || target.textContent || "");
    if (overlay && !overlay.contains(event.target)) closeOverlay();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeOverlay();
    const target = event.target instanceof Element ? event.target.closest(objectSelector) : null;
    if (
      target &&
      target.tagName !== "BUTTON" &&
      target.getAttribute("role") === "button" &&
      (event.key === "Enter" || event.key === " ")
    ) {
      event.preventDefault();
      emit(target.getAttribute("data-agent2ui-content") || target.textContent || "");
    }
  });

  document.addEventListener("submit", (event) => {
    const form = event.target;
    if (!(form instanceof HTMLFormElement) || !form.hasAttribute("data-agent2ui-form")) return;
    event.preventDefault();
    emit(serializeFormFields(form));
  });

  document.addEventListener("contextmenu", (event) => {
    if (overlay?.contains(event.target)) return;
    const text = window.getSelection()?.toString().trim() || "";
    if (!text) return;
    event.preventDefault();
    selectedText = text;
    openMenu(event.clientX, event.clientY);
  });

  document.addEventListener("pointerdown", (event) => {
    if (overlay && !overlay.contains(event.target)) closeOverlay();
  });
  window.addEventListener("scroll", closeOverlay, true);
  window.addEventListener("resize", closeOverlay);
})();

  </script>
</body>
</html>

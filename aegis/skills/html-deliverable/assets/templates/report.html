<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --theme:#166c59; --on-theme:#fff; --page-background:#edf0ed; --page-foreground:#172029; --surface:#fbfcfa; --surface-foreground:#172029; --ink:var(--page-foreground); --muted:#5b6875; --line:#dce4e8; --paper:var(--surface); --accent:var(--theme); --accent-soft:color-mix(in srgb, var(--theme) 12%, white); --warm:#f7eddd; }
    * { box-sizing:border-box; } body { margin:0; color:var(--page-foreground); background:var(--page-background); font:15px/1.65 Manrope,system-ui,sans-serif; }
    main { max-width:1040px; margin:30px auto; padding:clamp(24px,5vw,64px); background:var(--paper); box-shadow:0 12px 50px #1b29201a; }
    .eyebrow,.meta { font:500 11px/1.4 "DM Mono",monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }
    header { padding-bottom:34px; border-bottom:1px solid var(--line); } h1 { max-width:800px; margin:12px 0; font-size:clamp(34px,6vw,62px); line-height:1.04; letter-spacing:-.055em; } .lede { max-width:700px; color:var(--muted); font-size:18px; }
    section { margin-top:46px; } h2 { margin:0 0 16px; font-size:22px; letter-spacing:-.03em; } h3 { margin:0 0 8px; font-size:16px; } .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .card { padding:20px; border:1px solid var(--line); border-radius:12px; background:#fff; } button.card,.callout,.action-button { width:100%; color:inherit; font:inherit; text-align:left; cursor:pointer; } .card p,.evidence p { margin:0; color:var(--muted); } .number { display:block; margin-bottom:6px; color:var(--accent); font-size:28px; font-weight:800; letter-spacing:-.05em; }
    .callout { padding:24px; border:0; border-left:4px solid var(--accent); background:var(--accent-soft); font-size:17px; } .evidence { display:grid; gap:12px; }
    .evidence article { padding:18px 0; border-top:1px solid var(--line); } ol { display:grid; gap:12px; padding-left:22px; } li::marker { color:var(--accent); font-weight:800; } .action-button { border:0; padding:0; background:transparent; }
    footer { margin-top:56px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    @media (max-width:700px) { main { margin:0; } .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">{{REPORT_TYPE}}</div>
      <h1>{{TITLE}}</h1>
      <p class="lede">{{SUBTITLE}}</p>
      <p class="meta">Prepared {{UPDATED_AT}} · {{AUTHOR_OR_TEAM}}</p>
    </header>

    <section aria-labelledby="summary-heading">
      <h2 id="summary-heading">Executive summary</h2>
      <button type="button" class="callout agent2ui-object" data-agent2ui-content="{{EXECUTIVE_SUMMARY}}" aria-label="Use executive summary in chat">{{EXECUTIVE_SUMMARY}}</button>
    </section>

    <section aria-labelledby="findings-heading">
      <h2 id="findings-heading">Key findings</h2>
      <div class="grid">
        <button type="button" class="card agent2ui-object" data-agent2ui-content="{{FINDING_1_TITLE}}: {{FINDING_1_DETAIL}}" aria-label="Use finding one in chat"><span class="number">01</span><h3>{{FINDING_1_TITLE}}</h3><p>{{FINDING_1_DETAIL}}</p></button>
        <button type="button" class="card agent2ui-object" data-agent2ui-content="{{FINDING_2_TITLE}}: {{FINDING_2_DETAIL}}" aria-label="Use finding two in chat"><span class="number">02</span><h3>{{FINDING_2_TITLE}}</h3><p>{{FINDING_2_DETAIL}}</p></button>
        <button type="button" class="card agent2ui-object" data-agent2ui-content="{{FINDING_3_TITLE}}: {{FINDING_3_DETAIL}}" aria-label="Use finding three in chat"><span class="number">03</span><h3>{{FINDING_3_TITLE}}</h3><p>{{FINDING_3_DETAIL}}</p></button>
      </div>
    </section>

    <section aria-labelledby="evidence-heading">
      <h2 id="evidence-heading">Evidence and context</h2>
      <div class="evidence">
        <article><h3>{{EVIDENCE_1_TITLE}}</h3><p>{{EVIDENCE_1_DETAIL}}</p></article>
        <article><h3>{{EVIDENCE_2_TITLE}}</h3><p>{{EVIDENCE_2_DETAIL}}</p></article>
      </div>
    </section>

    <section aria-labelledby="actions-heading">
      <h2 id="actions-heading">Recommended next actions</h2>
      <ol>
        <li><button type="button" class="action-button agent2ui-object" data-agent2ui-content="{{ACTION_1}}" aria-label="Use action one in chat">{{ACTION_1}}</button></li><li><button type="button" class="action-button agent2ui-object" data-agent2ui-content="{{ACTION_2}}" aria-label="Use action two in chat">{{ACTION_2}}</button></li><li><button type="button" class="action-button agent2ui-object" data-agent2ui-content="{{ACTION_3}}" aria-label="Use action three in chat">{{ACTION_3}}</button></li>
      </ol>
    </section>

    <footer>{{FOOTNOTE_OR_ASSUMPTION}}</footer>
  </main>
  <script>
(() => {
  "use strict";

  const channel = "aegis-agent2ui";
  const version = 1;
  const objectSelector = "[data-agent2ui-content]";
  let selectedText = "";
  let overlay = null;

  const style = document.createElement("style");
  style.textContent = `
    .agent2ui-object { cursor:pointer; }
    .agent2ui-object:focus-visible, .agent2ui-menu button:focus-visible, .agent2ui-prefix input:focus-visible { outline:3px solid var(--theme, #087ea4); outline-offset:3px; }
    .agent2ui-menu, .agent2ui-prefix { position:fixed; z-index:2147483647; width:min(248px, calc(100vw - 24px)); padding:6px; border:1px solid var(--line, #c6d2e0); border-radius:10px; background:var(--surface, #fff); color:var(--surface-foreground, #142235); box-shadow:0 12px 34px rgb(20 34 53 / .22); }
    .agent2ui-menu button { display:block; width:100%; border:0; border-radius:7px; padding:9px 10px; background:transparent; color:inherit; font:inherit; text-align:left; cursor:pointer; }
    .agent2ui-menu button:hover, .agent2ui-menu button:focus-visible { background:var(--page-background, #f4f7fb); }
    .agent2ui-prefix { display:grid; gap:8px; padding:10px; }
    .agent2ui-prefix label { font:600 12px/1.3 system-ui, sans-serif; }
    .agent2ui-prefix input { width:100%; border:1px solid var(--line, #c6d2e0); border-radius:6px; padding:8px; background:var(--page-background, #f4f7fb); color:inherit; font:inherit; }
    .agent2ui-prefix__actions { display:flex; justify-content:flex-end; gap:8px; }
    .agent2ui-prefix button { border:1px solid var(--line, #c6d2e0); border-radius:6px; padding:6px 9px; background:var(--surface, #fff); color:inherit; font:inherit; cursor:pointer; }
    .agent2ui-prefix button[type="submit"] { border-color:var(--theme, #087ea4); background:var(--theme, #087ea4); color:var(--on-theme, #fff); }
  `;
  document.head.append(style);

  function emit(text) {
    if (!text || !text.trim()) return;
    window.parent.postMessage(
      { channel, version, type: "composer.insert", text },
      "*",
    );
  }

  function formValue(field) {
    if (field instanceof HTMLInputElement) {
      if (field.type === "checkbox") return field.checked ? "true" : "false";
      if (field.type === "radio" && !field.checked) return null;
    }
    if (field instanceof HTMLSelectElement && field.multiple) {
      return Array.from(field.selectedOptions, (option) => option.value).join(", ");
    }
    return field.value;
  }

  function serializeFormFields(form) {
    return Array.from(form.querySelectorAll("input, textarea, select"))
      .filter((field) => {
        if (!(field instanceof HTMLInputElement || field instanceof HTMLTextAreaElement || field instanceof HTMLSelectElement)) return false;
        if (!field.id || field.disabled) return false;
        return !["button", "submit", "reset", "image", "file", "hidden"].includes(field.type);
      })
      .map((field) => {
        const value = formValue(field);
        return value === null ? null : `${field.id} : ${String(value).replace(/[\r\n]+/g, " ").trim()}`;
      })
      .filter((line) => line !== null)
      .join("\n");
  }

  function closeOverlay() {
    overlay?.remove();
    overlay = null;
  }

  function place(node, x, y) {
    document.body.append(node);
    const margin = 12;
    const rect = node.getBoundingClientRect();
    node.style.left = `${Math.max(margin, Math.min(x, window.innerWidth - rect.width - margin))}px`;
    node.style.top = `${Math.max(margin, Math.min(y, window.innerHeight - rect.height - margin))}px`;
    overlay = node;
  }

  function openPrefixInput(x, y) {
    closeOverlay();
    const form = document.createElement("form");
    form.className = "agent2ui-prefix";
    form.setAttribute("role", "dialog");
    form.setAttribute("aria-label", "自定义前缀");
    form.innerHTML = `<label for="agent2ui-prefix-input">自定义前缀</label><input id="agent2ui-prefix-input" type="text" autocomplete="off"><div class="agent2ui-prefix__actions"><button type="button">取消</button><button type="submit">插入</button></div>`;
    const input = form.querySelector("input");
    const [cancel] = form.querySelectorAll("button");
    function insertPrefix() {
      const prefix = input.value.trim();
      if (prefix) emit(`${prefix}\n${selectedText}`);
      closeOverlay();
    }
    cancel.addEventListener("click", closeOverlay);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      insertPrefix();
    });
    input.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        closeOverlay();
      }
    });
    input.addEventListener("blur", () => {
      window.setTimeout(() => {
        if (overlay === form && !form.contains(document.activeElement)) closeOverlay();
      }, 0);
    });
    place(form, x, y);
    input.focus();
  }

  function openMenu(x, y) {
    closeOverlay();
    const menu = document.createElement("div");
    menu.className = "agent2ui-menu";
    menu.setAttribute("role", "menu");
    menu.setAttribute("aria-label", "选中文本操作");
    const actions = [
      ["进一步分析…", () => emit(`进一步分析：\n${selectedText}`)],
      ["进一步调查…", () => emit(`进一步调查：\n${selectedText}`)],
      ["自定义前缀…", () => openPrefixInput(x, y)],
    ];
    actions.forEach(([label, action]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.setAttribute("role", "menuitem");
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        if (label !== "自定义前缀…") closeOverlay();
        action();
      });
      menu.append(button);
    });
    place(menu, x, y);
    menu.querySelector("button")?.focus();
  }

  document.addEventListener("click", (event) => {
    const target = event.target instanceof Element ? event.target.closest(objectSelector) : null;
    if (target) emit(target.getAttribute("data-agent2ui-content") || target.textContent || "");
    if (overlay && !overlay.contains(event.target)) closeOverlay();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeOverlay();
    const target = event.target instanceof Element ? event.target.closest(objectSelector) : null;
    if (
      target &&
      target.tagName !== "BUTTON" &&
      target.getAttribute("role") === "button" &&
      (event.key === "Enter" || event.key === " ")
    ) {
      event.preventDefault();
      emit(target.getAttribute("data-agent2ui-content") || target.textContent || "");
    }
  });

  document.addEventListener("submit", (event) => {
    const form = event.target;
    if (!(form instanceof HTMLFormElement) || !form.hasAttribute("data-agent2ui-form")) return;
    event.preventDefault();
    emit(serializeFormFields(form));
  });

  document.addEventListener("contextmenu", (event) => {
    if (overlay?.contains(event.target)) return;
    const text = window.getSelection()?.toString().trim() || "";
    if (!text) return;
    event.preventDefault();
    selectedText = text;
    openMenu(event.clientX, event.clientY);
  });

  document.addEventListener("pointerdown", (event) => {
    if (overlay && !overlay.contains(event.target)) closeOverlay();
  });
  window.addEventListener("scroll", closeOverlay, true);
  window.addEventListener("resize", closeOverlay);
})();

  </script>
</body>
</html>
